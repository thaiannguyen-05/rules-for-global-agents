name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skills + pack dry-run
        run: bash scripts/validate.sh

  version-guard:
    # PR nào đụng tới skills/ mà quên bump version trong package.json => fail sớm,
    # vì npm từ chối publish đè lên version đã tồn tại.
    name: Version bump guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require version bump when skills change
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          BASE_REF="origin/${{ github.base_ref }}"
          HEAD_VER=$(node -p "require('./package.json').version")
          BASE_VER=$(git show "$BASE_REF:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          echo "base ($BASE_REF): $BASE_VER | head: $HEAD_VER"
          if git diff --name-only "$BASE_REF...HEAD" | grep -qE '^(skills/|package\.json|README\.md|LICENSE)'; then
            if [ "$HEAD_VER" = "$BASE_VER" ]; then
              echo "::error::PR thay đổi skills/ nhưng version vẫn là $HEAD_VER. Hãy bump version (npm version patch) rồi push lại."
              exit 1
            fi
            echo "OK: version bumped $BASE_VER -> $HEAD_VER"
          else
            echo "OK: PR không đụng tới nội dung publish, không cần bump version."
          fi
