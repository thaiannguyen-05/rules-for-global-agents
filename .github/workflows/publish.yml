name: Publish to npm

# Publish hoàn toàn tự động, KHÔNG cần sửa package.json bằng tay.
# Vào Actions tab -> "Publish to npm" -> Run workflow -> chọn patch/minor/major.
# Workflow tự: validate -> bump version -> sync registry -> publish -> push tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Loại tăng version (patch: fix, minor: thêm skill, major: breaking)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write # cần để push commit + tag version về main
  id-token: write # cần cho --provenance (Sigstore) + npm trusted publishing

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Bump + publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (OIDC cần npm >= 11.5.1)
        # Node 22 mặc định kèm npm 10.x -> không hiểu Trusted Publishing,
        # publish sẽ fail ENEEDAUTH dù đã xóa _authToken.
        run: |
          npm install -g npm@11
          npm --version

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version (tự động, không cần sửa tay)
        # Chỉ bump + commit/tag local, CHƯA publish.
        # Publish nằm ở step riêng bên dưới để log rõ + tránh publish 2 lần.
        run: bash scripts/release.sh "${{ inputs.bump }}" --no-push --no-publish

      - name: Publish
        # Ưu tiên npm Trusted Publishing (OIDC, không cần token).
        # Nếu chưa cấu hình trusted publisher trên npmjs.com thì fallback
        # sang NPM_TOKEN (repo secret).
        # Lưu ý: setup-node tạo .npmrc chứa dòng _authToken rỗng khi secret
        # trống -> phải xóa dòng đó thì npm mới chịu dùng OIDC, nếu không
        # sẽ fail ENEEDAUTH. npm cũng trả 404 trên PUT khi OIDC chưa được
        # cấu hình đúng (sai repo/workflow/environment).
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Dùng NPM_TOKEN để publish."
          else
            echo "::notice::NPM_TOKEN trống, dùng npm Trusted Publishing (OIDC)."
            NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
            if [ -f "$NPMRC" ]; then
              sed -i '/_authToken/d' "$NPMRC" || true
              echo "Đã xóa _authToken trống khỏi $NPMRC để npm dùng OIDC."
            fi
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push commit + tag về main
        # Publish xong mới push: nếu publish fail thì repo không dính tag rác.
        run: git push --follow-tags
